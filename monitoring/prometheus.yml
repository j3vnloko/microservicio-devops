global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'microservicio-devops'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'microservicio-devops'
          environment: 'simulado'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']