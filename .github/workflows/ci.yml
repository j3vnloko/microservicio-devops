name: CI/CD Pipeline EP3 - Observabilidad y Cumplimiento

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:

  build-and-test:
    name: "Etapa 1 - Build y Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar y ejecutar pruebas con cobertura JaCoCo
        run: mvn clean verify

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  security-and-quality:
    name: "Etapa 2 - Seguridad y Calidad"
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar con cobertura para SonarQube
        run: mvn clean verify

      - name: Análisis de calidad con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=j3vnloko_microservicio-devops \
            -Dsonar.organization=j3vnloko \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.qualitygate.wait=false

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Escaneo de seguridad con Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --all-projects

  deploy-kubernetes:
    name: "Etapa 3 - Deploy Kubernetes"
    runs-on: ubuntu-latest
    needs: security-and-quality
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Crear clúster Kubernetes con Kind
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: microservicio-cluster

      - name: Build imagen Docker
        run: docker build -t microservicio-devops:latest .

      - name: Cargar imagen al clúster Kind
        run: kind load docker-image microservicio-devops:latest --name microservicio-cluster

      - name: Deploy a Kubernetes
        run: kubectl apply -f k8s/deployment.yaml

      - name: Verificar rollout
        run: kubectl rollout status deployment/microservicio-devops --timeout=90s

      - name: Mostrar pods corriendo
        run: kubectl get pods -o wide