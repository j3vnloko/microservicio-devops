apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservicio-devops
  labels:
    app: microservicio-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservicio-devops
  template:
    metadata:
      labels:
        app: microservicio-devops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: microservicio
          image: microservicio-devops:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://db-service:3306/base?serverTimezone=UTC&useSSL=false"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "password"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: microservicio-service
spec:
  selector:
    app: microservicio-devops
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP